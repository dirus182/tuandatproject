$kind: http-request
name: 'Get product by ID'
method: GET
url: '{{baseUrl}}/api/products/:id'
order: 2000
pathVariables:
  - key: id
    value: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });
