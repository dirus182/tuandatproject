$kind: http-request
name: 'Create product'
method: POST
url: '{{baseUrl}}/api/products'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "cake_id": 1,
      "option_cake_id": 1,
      "quantity": 10,
      "price": 125000.00,
      "description": [
        "Banh kem size nho",
        "Vi chocolate"
      ],
      "cake_name": "Banh kem chocolate",
      "create_at": "2026-06-06T10:00:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });
