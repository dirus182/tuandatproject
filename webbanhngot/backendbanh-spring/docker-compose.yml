services:
  postgres:
    image: postgres:17
    container_name: postgres-banh
    environment:
      POSTGRES_DB: 20225802gr2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../doannnn.sql:/docker-entrypoint-initdb.d/doannnn.dump:ro
      - ./docker/postgres/01-restore-dump.sh:/docker-entrypoint-initdb.d/01-restore-dump.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: backendbanh-spring
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/20225802gr2
      DB_USER: postgres
      DB_PASSWORD: admin
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/20225802gr2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TZ: Asia/Bangkok
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Bangkok
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: frontend-banh
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
